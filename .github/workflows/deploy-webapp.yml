name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Compute app version
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('./package.json', 'utf8')).version")"
          short_sha="${GITHUB_SHA::7}"
          echo "APP_VERSION=${package_version}+${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_ENV"

      - name: Build webapp
        run: pnpm build

      - name: Generate self-documentation
        run: node --experimental-strip-types scripts/generate-default-docs.ts

      - name: Build docs
        run: |
          [ -d dist ] || { echo "Validation failed: dist directory not found after the webapp build. Check the webapp build step output above for errors."; exit 1; }
          mkdocs build --strict --site-dir dist/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy app and docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
